<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Constelação de Órion</title>
</head>
<body style="margin:0;padding:12px;background:#000;color:#e9e6dc;font-family:system-ui,Arial,sans-serif;text-align:center">
    <h3 style="margin:0 0 4px;font-family:Georgia,serif">Constelação de Órion</h3>

    <svg style="width:100%;height:auto;max-height:220px" viewBox="30 20 340 260" role="img" aria-label="Constelação de Órion, com as Três Marias no meio">
        <line x1="150" y1="50" x2="170" y2="130" stroke="lightblue"/>
        <line x1="250" y1="55" x2="230" y2="130" stroke="lightblue"/>
        <line x1="170" y1="130" x2="230" y2="130" stroke="lightblue"/>
        <line x1="170" y1="130" x2="165" y2="245" stroke="lightblue"/>
        <line x1="230" y1="130" x2="245" y2="240" stroke="lightblue"/>

        <circle cx="150" cy="50" r="8" fill="orange"/>
        <circle cx="250" cy="55" r="6" fill="white"/>
        <circle cx="170" cy="130" r="5" fill="white"/>
        <circle cx="200" cy="130" r="5" fill="white"/>
        <circle cx="230" cy="130" r="5" fill="white"/>
        <circle cx="165" cy="245" r="7" fill="lightblue"/>
        <circle cx="245" cy="240" r="6" fill="white"/>

        <g fill="#e9e6dc" font-size="11" font-family="sans-serif">
            <text x="138" y="54" text-anchor="end">Betelgeuse</text>
            <text x="262" y="59">Bellatrix</text>
            <text x="200" y="152" text-anchor="middle">Três Marias</text>
            <text x="153" y="249" text-anchor="end">Rigel</text>
            <text x="257" y="244">Saiph</text>
        </g>
    </svg>

    <p style="font-size:14px;margin:6px 0 0">Estrela laranja: Betelgeuse. Estrela azul: Rigel. No meio, as Três Marias.</p>
</body>
</html>
